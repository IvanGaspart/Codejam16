[project]
name = "scanner"
version = "0.1.0"
description = "LARP-scan scanner: Trottier floor prediction + BLE sightings"
readme = "README.md"
authors = [
    { name = "Zachary Chuang", email = "zmchuang365@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ap-detect",
    "bleak>=1.0.0",
    "httpx>=0.27.0",
    "pyobjc-framework-corewlan>=13.0 ; sys_platform == 'darwin'",
]

[project.scripts]
predict-floor = "scanner.predict:main"
collect-aps = "scanner.collect:main"
map-aps = "scanner.map_ap:main"
scan-loop = "scanner.scan_loop:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# Non-editable: copies into site-packages. Editable .pth files break when the
# venv lives under iCloud Drive (UF_HIDDEN → Python 3.13 "Skipping hidden .pth").
ap-detect = { path = "../ap_detect", editable = false }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]
# _bin/ is gitignored (built locally by helper/build.sh); artifacts ships it anyway
artifacts = ["src/scanner/_bin/**"]
