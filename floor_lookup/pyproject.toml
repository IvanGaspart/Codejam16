[project]
name = "floor-lookup"
version = "0.1.0"
description = "Map connected Wi-Fi BSSID to a Trottier floor using a surveyed lookup table"
readme = "README.md"
authors = [
    { name = "Zachary Chuang", email = "zmchuang365@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ap-detect",
]

[project.scripts]
predict-floor = "floor_lookup.predict:main"
collect-aps = "floor_lookup.collect:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
ap-detect = { path = "../ap_detect", editable = true }
